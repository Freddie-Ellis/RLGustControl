name = "ae_cfd_test"
seed = 0

# Network (defaults in src/ml/ae/sparse_latent.py)
latent_dim = 6          # TODO: choose from experiments (plan: 3 to 8). Size of the latent z
hidden = 64             # width of the encoder and decoder layers

# Optimisation
epochs = 5000
lr = 0.001
weight_decay = 0.0001   # shrinkage against fitting individual runs (~100 CFD runs)
load_weight = 1.0       # weight of the load heads' loss against the reconstruction loss
input_noise_cp = 0.005  # sensor noise added to the input taps each epoch, in Cp

# Data
folds = 5               # k-fold cross-validation picks the epoch count and gives the validation errors, then
                        # the saved model trains on every run; 1 = no validation, train every run for `epochs`
# Continue from an earlier run (fine-tuning): start from its weights and standardisation. latent_dim and hidden must
# match it; a lower lr (e.g. 1e-4) keeps what it learnt.
# init_from = "runs/autoencoder/20261125-132458_ae_cfd_test"
# data_dir = "src/data/cfd"                            # extracted CFD (default: src/data/cfd.py's CFD_DATA_DIR)
# taps_file = "src/ml/taps/selections/taps.parquet"    # tap layout from src/ml/taps/cfd_taps.py
