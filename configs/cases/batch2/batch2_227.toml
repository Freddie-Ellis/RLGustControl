# Written by src/cfd/batch_cases.py: rows 227, 228, 229, 230, 231, 232 of the case table (see index.csv).

description = "Batch case batch2_227: 6 flow condition(s)"
geometry = "cad/uav/geometry.toml"
mesh = "configs/mesh/uav.toml"
solver = "configs/solver/uav_rans.toml"

# Added by hand (re-add if batch_cases.py rewrites this file). With every surface deflected, layer addition never
# settled near the tight corners: a bad face tet hopped between neighbouring faces for 60 iterations and one was
# left at the 100-iteration limit, failing checkMesh. nGrow 1 also drops layers on the faces around any face that
# can't be extruded, which stops the hopping. Only this case: elsewhere it would cost layers for nothing.
[mesh_overrides]
layer_n_grow = 1

[deflections_deg]
wingtip_r = 50
wingtip_l = 50
obte_flap_r = 50
obte_flap_l = 50
ibte_flap_r = 50
ibte_flap_l = 50
upr_splitter_flap_r = 60
upr_splitter_flap_l = 60
lwr_splitter_flap_r = 60
lwr_splitter_flap_l = 60

[flow]
pairs = [[-3, 0], [3, 0], [9, 0], [15, 0], [21, 0], [27, 0]]
