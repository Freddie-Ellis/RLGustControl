# Mesh check with every control surface at its maximum deflection (mesh only: no solver or [flow]).
# Submit with   bash hpc/submit_cases.sh configs/cases/uav_full_actuation.toml
# Signs (see cad/uav/geometry.toml): wingtips and trailing-edge flaps +25 = trailing edge up; leading-edge
# flaps +25 = leading edge down; splitters 90 = fully open (upper up, lower down).

description = "Mesh check: every control surface at its maximum deflection"
geometry = "cad/uav/geometry.toml"
mesh = "configs/mesh/uav.toml"

[deflections_deg]
wingtip_r = 25.0
wingtip_l = 25.0
le_flap_r = 25.0
le_flap_l = 25.0
obte_flap_r = 25.0
obte_flap_l = 25.0
ibte_flap_r = 25.0
ibte_flap_l = 25.0
upr_splitter_flap_r = 90.0
upr_splitter_flap_l = 90.0
lwr_splitter_flap_r = 90.0
lwr_splitter_flap_l = 90.0
