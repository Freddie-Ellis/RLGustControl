# First test mesh for the AeroGeom_v2 UAV. Loaded by src/cfd/mesh.py (MeshSettings.from_toml).
# Lengths in metres. Refinement level n gives cells of base_cell_size / 2**n:
#   level 5 = 12 mm, 7 = 3 mm, 8 = 1.5 mm, 9 = 0.75 mm.
# Base cell reduced from 0.512 to 0.384 m (every level 25% finer): ~1.7M -> ~3-3.5M cells.

# Domain, in aircraft lengths (0.52 m): about 10 m upstream, 21 m downstream, 10 m to each side.
upstream_lengths = 20.0
downstream_lengths = 40.0
lateral_lengths = 20.0
base_cell_size = 0.384

# Surface refinement (min, max): min everywhere, max where the surface curves sharply (leading edges).
# Uniform over the whole skin: 1.5 mm, refined to 0.75 mm at leading-edge curvature.
fixed_body_level = [8, 9]
control_surface_level = [8, 9]
feature_level = 9                # 0.75 mm along sharp edges (trailing edges, tips)
feature_included_angle = 150.0
resolve_feature_angle = 30.0
n_cells_between_levels = 3

# Volume refinement: 12 mm cells around the aircraft and in the near wake (leading-edge vortices).
near_level = 5
near_padding_lengths = 0.3
wake_level = 5
wake_lengths = 2.0

# Prism layers on every wall, sized relative to the local surface cell.
n_layers = 5
layer_expansion_ratio = 1.2
final_layer_thickness = 0.5
min_layer_thickness = 0.1

max_local_cells = 5_000_000
max_global_cells = 100_000_000

# Iteration counts. Cutting them to 30 / 20 / 10 left 4 bad face tets after snapping and reduced layer
# coverage from ~85% to ~70%.
n_snap_solve_iter = 100
n_layer_iter = 50
n_relaxed_layer_iter = 20

# The merged skin must have no slits narrower than this (m); the case is not written if it does.
skin_min_gap = 1e-4

# Pass/fail limits applied by src/cfd/mesh_report.py after checkMesh.
[acceptance]
max_non_orthogonality = 70.0
max_skewness = 4.0
min_layer_thickness_percent = 80.0
