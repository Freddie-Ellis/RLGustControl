name = "test"
seed = 42

[env]
kind = "xfoil_pitch"

[env.spec]
dt = 0.01
horizon = 100

[env.params]
tau = 0.3
cl_ref = 0.5
gust_len = 1.0
gust_amp_deg = 4.0
base_alpha_deg = 4.0
act_limit = 1.0
flap_max_deg = 15.0
flap_hinge_x = 0.75
action_cost = 0.01
naca = "0012"
reynolds = 1e6
xfoil_path = "C:\\XFOIL6.99\\xfoil.exe"
timeout_s = 30.0

[policy]
kind = "gaussian_mlp"
hidden = 64
init_log_std = -0.5

[algo]
kind = "ppo"
iterations = 60
n_envs = 64
gamma = 0.98
lam = 0.95
clip = 0.2
epochs = 8
minibatch = 1024
lr = 0.0003
ent_coef = 0.0
vf_coef = 0.5
max_grad_norm = 0.5
